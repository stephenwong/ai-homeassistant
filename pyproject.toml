[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.hatch.build]
exclude = ["tools/_dev"]

[project]
name = "ha-config-tools"
version = "1.0.0"
description = "Home Assistant configuration management and validation tools"
authors = [
    {name = "Home Assistant Config Management"}
]
requires-python = ">=3.14.2"
dependencies = [
    "homeassistant>=2026.11.3",
    "voluptuous",
    "pyyaml>=6.0.0",
    "jsonschema",
    "requests",
    "aiohttp",
    "ruamel-yaml>=0.19.1",
]

[project.scripts]
ha-cli = "tools.ha_cli:main"

[dependency-groups]
dev = [
    "ruff==0.17.6",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "types-PyYAML>=6.0.12.20261122",
    "types-requests>=2.33.0.20261030",
]

[tool.ruff]
line-length = 88
target-version = "py314"
exclude = [
    ".venv",
    "venv",
    "build",
    "dist",
    "config",
    "temp",
    "tools/_dev",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (undefined names, unused imports)
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modernize syntax)
    "B",    # bugbear (common pitfalls)
    "SIM",  # simplify (unnecessary complexity)
    "RUF",  # Ruff-specific rules
    "PERF", # performance anti-patterns
    "PIE",  # flake8-pie
    "C4",   # comprehensions
    "FURB", # refurb (modern Python idioms)
    "PLW",  # pylint warnings
    "PTH",  # prefer pathlib over os.path/open
]
per-file-ignores = {"__init__.py" = ["F401"], "tests/**" = ["PTH", "RUF012", "RUF059"]}

[tool.ruff.lint.isort]
known-first-party = ["tools"]

[tool.mypy]
python_version = "3.14"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_return_any = false
allow_untyped_globals = true
allow_redefinition = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = false
warn_unreachable = true
strict_equality = true
exclude = [
    "venv/",
    ".venv/",
    "build/",
    "dist/",
    "tools/_dev/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=tools",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=90",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["tools"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    "*/tools/_dev/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.uv]
# Force patched versions over transitive pins to resolve Dependabot alerts
override-dependencies = [
    "anyio>=4.16.0",
    "certifi>=2026.11.20",
    "filelock>=4.3.1",
    "idna>=3.20",
    "multidict>=6.9.1",
    "urllib3>=2.8.0",
    "uv>=0.13.9",
    "virtualenv>=21.15.13",
    "zeroconf>=0.154.0",
]

[tool.codespell]
ignore-words-list = "hass"
